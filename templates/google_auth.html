<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autenticación con Google - Librería Editorial</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='google-logo.css') }}" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  </head>
  <body>
    <div class="google-container">
      <div class="loading-container">
        <i class="fas fa-book book-icon"></i>
        <h2>Librería Editorial</h2>
        <p class="loading-text">Iniciando sesión con Google...</p>
        <div class="spinner"></div>
        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>

        <div class="google-badge">
          <svg
            class="google-logo"
            viewBox="0 0 18 18"
            xmlns="http://www.w3.org/2000/svg">
            <path
              d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"
              fill="#4285F4" />
            <path
              d="M9.003 18c2.43 0 4.467-.806 5.956-2.183l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9.003 18z"
              fill="#34A853" />
            <path
              d="M3.964 10.712c-.18-.54-.282-1.117-.282-1.71 0-.593.102-1.17.282-1.71V4.96H.957C.347 6.175 0 7.55 0 9.002c0 1.452.348 2.827.957 4.042l3.007-2.332z"
              fill="#FBBC05" />
            <path
              d="M9.003 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.464.891 11.426 0 9.003 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29c.708-2.127 2.692-3.71 5.036-3.71z"
              fill="#EA4335" />
          </svg>
          Autenticación segura
        </div>

        <div class="error-message" id="errorMessage">
          <strong>⚠️ Error de autenticación</strong>
          <span id="errorText"></span>
          <br />
          <button class="retry-btn" onclick="window.location.href='/login'">
            <i class="fas fa-arrow-left"></i> Volver al login
          </button>
        </div>
      </div>
    </div>

    <script type="module">
      import { initGoogleAuth } from '/static/js/google-auth.js';

      const firebaseConfig = {{ firebase_config | tojson }};

      initGoogleAuth(firebaseConfig);
    </script>
  </body>
</html>
